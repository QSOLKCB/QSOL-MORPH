name: Fix provenance schema convergence

on:
  push:
    branches:
      - docs/foundation-specification
    paths:
      - .github/workflows/fix-provenance-schema-convergence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foundation-specification
          fetch-depth: 0

      - name: Patch documentation schemas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # AGENTS.md: make output protected-use attribution occurrence-specific.
          replace_once(
              "AGENTS.md",
              """external_tool_ids[]
          backend_selection_scope_ids[]
          generated_artifact_ids[]?
          result_determinism_scope_ids[]""",
              """external_tool_ids[]
          backend_selection_scope_ids[]
          generated_artifact_ids[]?
          machinery_use_record_ids[]
          result_determinism_scope_ids[]""",
          )

          replace_once(
              "AGENTS.md",
              """When an effect materially produces or exposes an output, link the output to concrete attempt IDs and link those attempts back to the output. Every output carries explicit `external_tool_ids[]`: use an empty array only when no material external tool contributed. When an external tool materially supplies evidence/data, the nonempty output array and the tool's concrete subject links must agree reciprocally; broad source-CARD attribution or omission of the array is not evidence of no tool participation.

          ## External-tool provenance work""",
              """When an effect materially produces or exposes an output, link the output to concrete attempt IDs and link those attempts back to the output. Every output carries explicit `external_tool_ids[]`: use an empty array only when no material external tool contributed. When an external tool materially supplies evidence/data, the nonempty output array and the tool's concrete subject links must agree reciprocally; broad source-CARD attribution or omission of the array is not evidence of no tool participation.

          Every output also carries explicit `machinery_use_record_ids[]`. It identifies the exact protected-use occurrence or occurrences that materially produced, supplied, or exposed the output, and every listed use must reciprocally name the output in `machinery_use_records[].output_ids[]`. The array is empty only when no protected machinery use materially contributed. A shared CARD execution, backend-selection scope/decision, backend unit, or generated artifact cannot substitute for this occurrence-level join when several launches or retries are possible.

          ## External-tool provenance work""",
          )

          # AGENTS.md: align the agent attempt schema with the canonical trace.
          replace_once(
              "AGENTS.md",
              """completion_state
          observable_output_ids[]
          external_tool_ids[]?""",
              """completion_state
          acquired_input_ids[]
          observable_output_ids[]
          external_tool_ids[]""",
          )

          replace_once(
              "AGENTS.md",
              """Every contextual effect authorization record must identify the attempt/declaration/CARD **and concrete `card_execution_id`**, complete required/granted/denied capability sets, policy identity/version, authorization outcome, and `authorization_sequence_index?`.""",
              """`acquired_input_ids[]` is explicit on every attempt and reciprocates `inputs[].effect_attempt_ids[]`. It may be nonempty even when the CARD later fails or the attempt publishes no output. For `completion_state = NOT_STARTED`, both `acquired_input_ids[]` and `observable_output_ids[]` are empty because no protected acquisition or observable effect began.

          `external_tool_ids[]` is explicit on every attempt. Use an empty array only when no material external model, prover, process, service, or other tool participated in that concrete attempt. Every listed tool resolves to `external_tool_versions[]` and reciprocally lists the attempt in its `effect_attempt_ids[]`; omission is incomplete provenance, not an assertion of no tool participation. A `NOT_STARTED` attempt necessarily has an empty tool array.

          Every contextual effect authorization record must identify the attempt/declaration/CARD **and concrete `card_execution_id`**, complete required/granted/denied capability sets, policy identity/version, authorization outcome, and `authorization_sequence_index?`.""",
          )

          # AGENTS.md: state first-lowering contract-transition authority/evidence explicitly.
          replace_once(
              "AGENTS.md",
              """Unsupported semantic constructs or qualifiers fail explicitly. Do not silently drop, no-op, default, or defer their meaning to a backend.""",
              """For `result_determinism_lowering_decisions[]`, `randomness_lowering_decisions[]`, and `failure_behavior_lowering_decisions[]`, a first-lowering semantic change requires both `transition_authorized_by` and `transition_evidence_id`. The rule must be accepted, versioned/content-bound `CONTRACT_TRANSITION` authority; the evidence must be passing and bound to the exact lowering decision, requested/effective contract pair, complete owner-qualified Semantic/Core scopes, and active context, with validation preceding application in the shared event-order domain. Preserve the same authority/evidence into the resulting execution-scope record rather than treating the Core IR hash as proof. For failure behavior, the preserved authority occupies `mapping_or_transition_rule_id`; result-determinism and randomness preserve `transition_authorized_by` directly.

          Unsupported semantic constructs or qualifiers fail explicitly. Do not silently drop, no-op, default, or defer their meaning to a backend.""",
          )

          # First-lowering specification: define transition authority/evidence and preservation.
          replace_once(
              "docs/SEMANTIC-TO-CORE-LOWERING.md",
              """A transformation that changes the legal numeric behavior or randomness requirements is not merely a representation change.

          ## Units and types""",
              """A transformation that changes the legal numeric behavior or randomness requirements is not merely a representation change.

          First-lowering decision families that can change execution-contract semantics carry an explicit authority/evidence pair on the affected decision record:

          ```text
          transition_authorized_by?
          transition_evidence_id?
          ```

          For `result_determinism_lowering_decisions[]`, `randomness_lowering_decisions[]`, and `failure_behavior_lowering_decisions[]`, both fields are mandatory whenever the source/requested semantics differ from the effective Core semantics. `transition_authorized_by` resolves to accepted versioned/content-bound `CONTRACT_TRANSITION` authority. `transition_evidence_id` resolves to passing validation evidence for the exact first-lowering decision and mapped subject, requested/effective contract pair, complete owner-qualified Semantic/Core scope endpoints, and active context. The validation event must precede activation or application of the changed Core contract in the shared monotonic event-order domain. Missing, stale, wrong-kind, context-mismatched, unverifiable, self-authorized, or late authority/evidence fails closed. Both fields may be absent only for semantics-preserving mapping where no transition occurred.

          Lowering must preserve that same authority/evidence relation into the governed execution-contract record. Result-determinism and randomness execution scopes retain the identical `transition_authorized_by` / `transition_evidence_id` values. Failure behavior retains the identical authority identity as `mapping_or_transition_rule_id` together with the same `transition_evidence_id`. A later runtime success label, IR hash, or post-application validation cannot substitute for the pre-application evidence.

          ## Units and types""",
          )

          replace_once(
              "docs/SEMANTIC-TO-CORE-LOWERING.md",
              """`result_determinism_lowering_decisions[]`, `randomness_lowering_decisions[]`, and `failure_behavior_lowering_decisions[]` record scope preservation, grouping, identity changes, frozen normalizations, and any permitted transitions needed to explain how source requirements became Core contracts. IR hashes alone cannot establish that correspondence.""",
              """`result_determinism_lowering_decisions[]`, `randomness_lowering_decisions[]`, and `failure_behavior_lowering_decisions[]` record scope preservation, grouping, identity changes, frozen normalizations, and any permitted transitions needed to explain how source requirements became Core contracts. Whenever semantics change, the applicable decision carries the required `transition_authorized_by` / `transition_evidence_id` pair, validated before application and preserved into the resulting execution-scope record as defined above. IR hashes alone cannot establish that correspondence or authorize a transition.""",
          )

          # TRACE: source identities carry containment instead of parallel local-ID lists.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """source_trace:
              source_hash
              spec_version
              run_id?
              job_id
              deck_ids[]
              card_ids[]
              source_location?
          ```

          ## Semantic trace""",
              """source_trace:
              source_hash
              spec_version
              run_id?
              job_id
              deck_identities[]:
                  deck_id
                  owner_scope_path[]:
                      scope_kind
                      scope_id
              card_identities[]:
                  card_id
                  owner_scope_path[]:
                      scope_kind
                      scope_id
              source_location?
          ```

          Each `deck_identities[]` path is the complete ordered canonical containment path from the JOB through the referenced DECK and terminates at that `deck_id`. Each `card_identities[]` path includes the owning JOB and DECK and terminates at that `card_id`. Every ancestor needed to distinguish reused local IDs participates in identity. Parallel bare `deck_ids[]` / `card_ids[]`, positional pairing, first-match lookup, or list order cannot establish containment; missing, truncated, reordered, ambiguous, or owner-mismatched identity paths fail closed.

          ## Semantic trace""",
          )

          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """failure_behavior_bindings[]
          ```

          ### Epistemic class bindings""",
              """failure_behavior_bindings[]
          ```

          The semantic-trace `job_ids[]`, `deck_ids[]`, and `card_ids[]` are inventory summaries only. They do not establish parentage or owner identity. Canonical containment is resolved from the hash-bound Semantic IR and the owner-qualified identities in `source_trace`; no semantic binding may infer ownership from these summary arrays or their relative positions.

          ### Epistemic class bindings""",
          )

          # TRACE: one canonical failure-binding shape across source and execution layers.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """failure_behavior_bindings[]:
              failure_behavior_binding_id
              owner_scope_path[]:
                  scope_kind
                  scope_id
              source_card_ids[]
              requested_failure_behavior_id
              effective_failure_behavior_id
              mapping_or_transition_rule_id?
              transition_evidence_id?
          ```

          `failure_behavior_binding_id` is the stable record identity used by result and failure provenance. It is distinct from the generic computation `scope_id` and remains resolvable even when several bindings or policy transitions concern one governed computation.

          The owning source scope is identified by its complete ordered absolute `owner_scope_path[]`, not a bare kind/local ID. The path terminates at the JOB, DECK, CARD, or other frozen scope that owns the contract, so repeated local IDs under sibling containers remain distinct. Distinct source requirements may not be collapsed into one execution-wide declaration unless a frozen normalization proves that collapse is lossless. Failure bindings obey the same [failure-policy transition conditions](#failure-policy-transitions) here and in the execution-scope inventory.""",
              """failure_behavior_bindings[]:
              failure_behavior_binding_id
              governed_scope_ref:
                  representation_kind
                  representation_identity
                  owner_scope_path[]:
                      scope_kind
                      scope_id
              source_card_ids[]
              requested_failure_behavior_id
              effective_failure_behavior_id
              mapping_or_transition_rule_id?
              transition_evidence_id?
          ```

          `failure_behavior_binding_id` is the stable record identity used by result and failure provenance. It is distinct from the generic computation `scope_id` and remains resolvable even when several bindings or policy transitions concern one governed computation.

          Source and execution failure bindings use this one canonical representation-qualified shape. In the Semantic-trace layer, `governed_scope_ref.representation_kind` identifies Semantic IR and `governed_scope_ref.representation_identity` is the content-bound `semantic_ir_hash`; the complete ordered `owner_scope_path[]` terminates at the JOB, DECK, CARD, or other frozen scope that owns the contract. Later execution/lowered bindings keep the same field shape while naming their actual governed representation and identity. There is no alternate direct-`owner_scope_path[]` failure-binding form sharing this stable-ID namespace. Missing representation identity, truncated/ambiguous owner paths, or owner/representation mismatch fails closed.

          Distinct source requirements may not be collapsed into one execution-wide declaration unless a frozen normalization proves that collapse is lossless. Failure bindings obey the same [failure-policy transition conditions](#failure-policy-transitions) here and in the execution-scope inventory.""",
          )

          # TRACE: first-lowering transition schema mirrors the second boundary and execution records.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """The same typed-endpoint principle applies to machinery-requirement, result-determinism, numeric-contract, randomness, and failure-behavior lowering decisions. A JOB-owned requirement must not be silently relocated to a CARD or detached from the Core scope that inherits it.

          Machinery requirements additionally need an explicit requirement-level association at this first boundary:""",
              """The same typed-endpoint principle applies to machinery-requirement, result-determinism, numeric-contract, randomness, and failure-behavior lowering decisions. A JOB-owned requirement must not be silently relocated to a CARD or detached from the Core scope that inherits it.

          For first-lowering contract decision families that can change semantics, the applicable decision record also carries:

          ```text
          transition_authorized_by?
          transition_evidence_id?
          ```

          For `result_determinism_lowering_decisions[]`, `randomness_lowering_decisions[]`, and `failure_behavior_lowering_decisions[]`, any semantic change between source/requested and effective Core contracts requires both fields. `transition_authorized_by` resolves to an accepted versioned/content-bound `CONTRACT_TRANSITION` rule. `transition_evidence_id` resolves to passing `validation_evidence[]` for the exact first-lowering decision/mapped subject, requested/effective pair, complete owner-qualified source/Core scopes, and active context. Its validation event must precede application of the changed Core contract in the shared event-order domain. A rule assertion without passing subject-bound pre-application evidence is unauthorized and fails closed; both fields may be absent only when no semantic transition occurred.

          The authority/evidence relation is preserved into the resulting execution-contract record rather than reconstructed later. Result-determinism and randomness scopes retain the same `transition_authorized_by` and `transition_evidence_id`; failure-behavior bindings retain the same authority identity in `mapping_or_transition_rule_id` plus the same `transition_evidence_id`. IR hashes, mapping metadata, or post-application success cannot substitute for this relation.

          Machinery requirements additionally need an explicit requirement-level association at this first boundary:""",
          )

          # Remove the temporary workflow from the final tree.
          wf = Path(".github/workflows/fix-provenance-schema-convergence.yml")
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "EmergentMonk"
          git config user.email "73952179+EmergentMonk@users.noreply.github.com"
          git add AGENTS.md docs/SEMANTIC-TO-CORE-LOWERING.md docs/TRACE-AND-PROVENANCE.md .github/workflows/fix-provenance-schema-convergence.yml
          git diff --cached --check
          git commit -m "docs: align transition and trace provenance schemas"
          git push origin HEAD:docs/foundation-specification
