name: One-shot trace review fix

on:
  push:
    branches:
      - docs/foundation-specification
    paths:
      - .github/workflows/trace-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/foundation-specification
          fetch-depth: 0

      - name: Apply trace-contract fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/TRACE-AND-PROVENANCE.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """    source_card_ids[]\n    machinery_requirement_ids[]\n    required_capabilities[]\n""",
                  """    source_card_ids[]\n    machinery_requirement_refs[]:\n        owner_scope_ref:\n            scope_kind\n            scope_id\n        machinery_requirement_id\n    required_capabilities[]\n""",
              ),
              (
                  """Before accepting any machinery authorization, resolve every `machinery_requirement_ids[]` entry to exactly one requirement in the hash-bound canonical input and its actual owning scope. Validate the trace requirement's identity, owner, target selector/class, and complete capability set against that canonical record, not against another runtime copy. For requirements carried through lowering, validate the source/lower requirement-ID associations and frozen mapping rules against both IR hashes through every traversed boundary. A map cannot silently discard a source permission or manufacture authorization. Unknown, ambiguous, mismatched, or duplicate requirement identities fail closed; a locally scoped requirement ID needs its unambiguous owning-scope context rather than a first-match lookup.\n\nFor an authorization record `A`, define `C(A)` as the union of the complete canonical capability sets of every uniquely resolved requirement named by `A.machinery_requirement_ids[]`. The membership and target applicability of each individual requirement remain validated even when capability names overlap. Require:\n""",
                  """Before accepting any machinery authorization, resolve every `machinery_requirement_refs[]` entry by the complete tuple `(owner_scope_ref.scope_kind, owner_scope_ref.scope_id, machinery_requirement_id)` to exactly one requirement in the hash-bound canonical input. `owner_scope_ref` names the requirement's actual canonical owner and is not inferred from `source_card_ids[]`, backend scope, or list position. Validate the trace requirement's identity, owner, target selector/class, and complete capability set against that canonical record, not against another runtime copy. For requirements carried through lowering, validate the source/lower requirement-ID associations and frozen mapping rules against both IR hashes through every traversed boundary. A map cannot silently discard a source permission or manufacture authorization. Unknown, ambiguous, mismatched, duplicate, or owner-mismatched requirement references fail closed; a bare locally scoped requirement ID is never sufficient.\n\nFor an authorization record `A`, define `C(A)` as the union of the complete canonical capability sets of every uniquely resolved requirement named by `A.machinery_requirement_refs[]`. The membership, owner, and target applicability of each individual requirement remain validated even when capability names or local requirement IDs overlap. Require:\n""",
              ),
              (
                  """    initiating_scope_ref?\n    machinery_authorization_record_ids[]\n    protected_use_start_sequence_index\n""",
                  """    initiating_scope_ref?\n    machinery_authorization_record_ids[]\n    output_ids[]\n    protected_use_start_sequence_index\n""",
              ),
              (
                  """`card_execution_ids[]` identifies the concrete CARD invocations participating in this use, not all invocations of the source CARD or backend unit. It is nonempty for CARD-governed work, and every ID resolves through `card_executions[]` to the corresponding canonical CARD and DECK execution in this run. A repeated launch, retry, or loop iteration receives a distinct use record with the correct concrete invocation IDs; an event index alone is not this join.\n\nFor genuine pre-CARD machinery setup only, the CARD-execution array may be empty and `initiating_scope_ref` is required instead.""",
                  """`card_execution_ids[]` identifies the concrete CARD invocations participating in this use, not all invocations of the source CARD or backend unit. It is nonempty for CARD-governed work, and every ID resolves through `card_executions[]` to the corresponding canonical CARD and DECK execution in this run. A repeated launch, retry, or loop iteration receives a distinct use record with the correct concrete invocation IDs; an event index alone is not this join.\n\n`output_ids[]` identifies all outputs materially produced or exposed by this exact protected-use event. Every listed output reciprocally contains this `machinery_use_record_id` in `outputs[].machinery_use_record_ids[]`, and every output-side machinery-use reference resolves back to a use record whose `output_ids[]` contains that output. The relation is occurrence-specific: matching CARD execution, backend-selection scope, generated artifact, or authorization records cannot substitute for the exact use-record join when the same protected machinery is launched more than once. A protected use that produces or exposes no output records an empty array rather than borrowing another use's output.\n\nFor genuine pre-CARD machinery setup only, the CARD-execution array may be empty and `initiating_scope_ref` is required instead.""",
              ),
              (
                  """    observable_output_ids[]\n    external_tool_ids[]?\n""",
                  """    observable_output_ids[]\n    external_tool_ids[]\n""",
              ),
              (
                  """Known completion takes precedence over uncertainty about broader external consequences. Completion belongs to the effect attempt, not to the enclosing CARD outcome.\n""",
                  """For `completion_state = NOT_STARTED`, no protected effect began. `effect_begin_sequence_index` and `effect_end_sequence_index` are absent, and both `acquired_input_ids[]` and `observable_output_ids[]` are empty. `external_tool_ids[]` is also empty because no material external-tool invocation can be attributed to an effect attempt that never began. An output MUST NOT reciprocally reference a `NOT_STARTED` attempt through `outputs[].effect_attempt_ids[]`; such a trace is contradictory and fails closed.\n\nKnown completion takes precedence over uncertainty about broader external consequences. Completion belongs to the effect attempt, not to the enclosing CARD outcome.\n""",
              ),
              (
                  """    source_card_ids[]?\n    effect_attempt_ids[]?\n    output_ids[]?\n```\n\nFor a material external tool, service, model, prover, process, or instrument, `tool_name_or_service` and a mutable endpoint are labels/locators only.""",
                  """    source_card_ids[]?\n    effect_attempt_ids[]\n    output_ids[]\n```\n\nFor a material external tool, service, model, prover, process, or instrument, `tool_name_or_service` and a mutable endpoint are labels/locators only.""",
              ),
              (
                  """If exact material identity cannot be established, record `material_identity_status = UNAVAILABLE` (or a frozen equivalent) and the strongest replay/evidence claim must be weakened or rejected according to the frozen policy. Identity unavailability may never be silently treated as full reproducibility.\n\nExtension resolution identifies the adapter/profile contract.""",
                  """If exact material identity cannot be established, record `material_identity_status = UNAVAILABLE` (or a frozen equivalent) and the strongest replay/evidence claim must be weakened or rejected according to the frozen policy. Identity unavailability may never be silently treated as full reproducibility.\n\nEvery material external-tool record has explicit `effect_attempt_ids[]` and `output_ids[]` arrays, with at least one concrete subject across the two arrays. Each referenced effect attempt reciprocally lists the tool in `effect_attempts[].external_tool_ids[]`; each referenced output reciprocally lists it in `outputs[].external_tool_ids[]`. Conversely, every attempt/output external-tool reference resolves to a tool record that names that exact subject. A canonical `source_card_ids[]` summary, shared endpoint, equal tool name, or repeated material identity cannot reconstruct this occurrence-level relation across retries. A material tool with no concrete attempt or output subject is incomplete provenance and fails closed rather than floating at CARD scope.\n\nExtension resolution identifies the adapter/profile contract.""",
              ),
              (
                  """    effect_attempt_ids[]?\n    external_tool_ids[]?\n    backend_selection_scope_ids[]\n    generated_artifact_ids[]?\n""",
                  """    effect_attempt_ids[]?\n    external_tool_ids[]\n    backend_selection_scope_ids[]\n    machinery_use_record_ids[]\n    generated_artifact_ids[]?\n""",
              ),
              (
                  """`effect_attempt_ids[]`, where applicable, identifies concrete effect attempts that produced or exposed the output. Those attempts reciprocally list the output in `observable_output_ids[]`.\n\n`external_tool_ids[]`, where applicable, identifies the exact material tools/services/models/provers that supplied the output.\n\n`generated_artifact_ids[]` identifies the exact executable/kernel/bytecode artifact that ran where applicable.""",
                  """`effect_attempt_ids[]`, where applicable, identifies concrete effect attempts that produced or exposed the output. Those attempts reciprocally list the output in `observable_output_ids[]`. A referenced attempt must have begun; `NOT_STARTED` attempts cannot appear in this relation.\n\n`external_tool_ids[]` is an explicit array identifying the exact material tools/services/models/provers that supplied the output, and every listed tool reciprocally names this output in `external_tool_versions[].output_ids[]`. It is empty when no material external tool supplied the output.\n\n`machinery_use_record_ids[]` is an explicit array identifying the exact protected-use event or events that materially produced or exposed the output. Every listed use reciprocally names this output in `machinery_use_records[].output_ids[]`. It is empty only when no protected machinery use materially contributed to the output. CARD execution, backend-selection scope, generated-artifact identity, and authorization IDs remain supporting context but cannot replace this occurrence-level join.\n\n`generated_artifact_ids[]` identifies the exact executable/kernel/bytecode artifact that ran where applicable.""",
              ),
              (
                  """- a machinery authorization's required set differs from the exact canonical union of its resolved requirements, or a successful grant does not cover that exact set;\n- a machinery use omits an independently applicable canonical requirement or uses grants for another target, scope, or policy context, even when its listed records and event ordering agree;\n""",
                  """- a machinery authorization uses a bare or owner-mismatched requirement ID instead of an exact typed owner-qualified `machinery_requirement_refs[]` entry, its required set differs from the exact canonical union of those resolved requirements, or a successful grant does not cover that exact set;\n- a machinery use omits an independently applicable canonical requirement or uses grants for another target, scope, or policy context, even when its listed records and event ordering agree;\n- an output that materially depends on protected machinery cannot be joined reciprocally to the exact `machinery_use_record_id` occurrence that produced or exposed it;\n""",
              ),
              (
                  """- an effect begins before its authorization completed;\n- protected machinery begins before every applicable authorization completed;\n""",
                  """- an effect begins before its authorization completed;\n- a `NOT_STARTED` effect attempt claims an acquired input, observable output, material external tool, or is reciprocally cited by an output;\n- protected machinery begins before every applicable authorization completed;\n""",
              ),
              (
                  """- a material external tool has neither immutable/versioned material identity nor an explicit identity-unavailable state that weakens the claim.\n""",
                  """- a material external tool has neither immutable/versioned material identity nor an explicit identity-unavailable state that weakens the claim;\n- a material external tool lacks a concrete effect-attempt/output subject, or its `effect_attempt_ids[]` / `output_ids[]` links disagree with reciprocal attempt/output `external_tool_ids[]` references.\n""",
              ),
              (
                  """| Concrete runtime input consumers and acquisition | Two reads/samples by repeated CARD invocations retain distinct captured input identities, exact consumer execution links, reciprocal CARD input links, and actual acquisition attempt/input links, including when an invocation fails with no output. | Keep only canonical source CARD IDs; swap consumers or acquisition attempts; collapse independent equal-content captures without occurrence mapping; use an output as the only join; fabricate inputs for denied/unstarted reads or CARD consumers for build-only inputs. |\n""",
                  """| Concrete runtime input consumers and acquisition | Two reads/samples by repeated CARD invocations retain distinct captured input identities, exact consumer execution links, reciprocal CARD input links, and actual acquisition attempt/input links, including when an invocation fails with no output. | Keep only canonical source CARD IDs; swap consumers or acquisition attempts; collapse independent equal-content captures without occurrence mapping; use an output as the only join; fabricate inputs for denied/unstarted reads or CARD consumers for build-only inputs. |\n| Owner-qualified machinery authorization | Each authorization names every requirement by typed owner scope plus local requirement ID, resolves that tuple uniquely in the canonical input, and validates the exact canonical capability union. | Bare local requirement ID; infer owner from source CARDs; confuse equal IDs owned by JOB and CARD; owner-mismatched lowering copy; first-match lookup. |\n| Repeated protected-use output attribution | Two protected launches under one CARD execution/scope retain distinct `machinery_use_record_id` values and reciprocal use/output links, so each output resolves to the exact launch that produced or exposed it. | Infer use from CARD execution/scope/artifact alone; attach both outputs to both launches; omit the use-side or output-side reciprocal link; borrow another launch's authorization/use occurrence. |\n| Material external-tool attribution | Every material tool record has at least one concrete effect-attempt/output subject and reciprocal `external_tool_ids[]` links; retries using different tool/model versions remain separately attributable. | Tool floats only at `source_card_ids[]`; omit both subject arrays; swap retry/output subjects; one-sided attempt/output link; equal endpoint/name used as attribution. |\n| NOT_STARTED effect attempt | A denied/unstarted attempt has no begin/end event, acquired inputs, observable outputs, or material external tools, and no output cites it as a producer/exposer. | Nonempty `observable_output_ids[]`; output reciprocally cites the unstarted attempt; acquired input or tool attribution despite no begin event. |\n""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Commit patched documentation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TRACE-AND-PROVENANCE.md
          git rm .github/workflows/trace-review-fix.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: tighten trace provenance joins"
          git push origin HEAD:docs/foundation-specification
