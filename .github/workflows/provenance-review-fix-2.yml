name: One-shot provenance identity review fix

on:
  push:
    branches:
      - docs/foundation-specification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply coordinated documentation fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count} for anchor:\n{old}")
              p.write_text(text.replace(old, new))

          # Canonical trace: owner-qualify declared effects.
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """effect_requirements[]:\n    declared_effect_id\n    card_id\n    effect_kind\n    required_capabilities[]""",
              """effect_requirements[]:\n    declared_effect_id\n    owner_scope_path[]:\n        scope_kind\n        scope_id\n    card_id\n    effect_kind\n    required_capabilities[]""",
          )
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """The declaration in the trace must match the corresponding declaration in the hash-bound canonical input, including owner, effect kind, and complete capability set. Agreement between two truncated runtime copies is not agreement with the canonical declaration. See [Declaration-bound authorization validation](#declaration-bound-authorization-validation).""",
              """Before authorization or attempt accounting, resolve every traced effect declaration by the complete tuple `(owner_scope_path[], declared_effect_id)` to exactly one effect requirement in the hash-bound canonical input. `owner_scope_path[]` is the ordered absolute canonical containment path `JOB -> DECK -> CARD`; its terminal CARD must equal `card_id`. Every ancestor is part of the declaration identity, so sibling DECKs may each contain local `CARD 7 / effect 7` without collision. The path is never inferred from local `card_id`, list position, producer IDs, or first-match lookup. The trace declaration must match the resolved canonical declaration's effect kind and complete capability set. Missing, incomplete, swapped, ambiguous, or owner-mismatched paths fail closed. Agreement between two truncated runtime copies is not agreement with the canonical declaration. See [Declaration-bound authorization validation](#declaration-bound-authorization-validation).""",
          )

          # Canonical trace: owner-qualify machinery declarations as well as authorization references.
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """machinery_requirements[]:\n    machinery_requirement_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    target_selector_or_class\n    required_capabilities[]""",
              """machinery_requirements[]:\n    machinery_requirement_id\n    owner_scope_path[]:\n        scope_kind\n        scope_id\n    source_card_ids[]\n    target_selector_or_class\n    required_capabilities[]""",
          )
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """Every trace requirement must resolve to the corresponding hash-bound canonical requirement, retaining its owning scope, target selector/class, and complete capability set. A lowered requirement additionally retains its validated source-to-lower requirement mapping. A runtime copy or a capability union cannot replace that canonical association. [Canonical machinery coverage](#canonical-machinery-coverage) is checked before accepting either a grant or a protected use.""",
              """Every traced machinery requirement resolves by the complete tuple `(owner_scope_path[], machinery_requirement_id)` to exactly one hash-bound canonical requirement. The ordered absolute path contains every JOB/DECK/CARD ancestor through the actual owning scope, matching the path shape used by `machinery_requirement_refs[]`; a local `(scope_kind, scope_id)` pair is not sufficient. The resolved declaration must retain the exact target selector/class and complete capability set. A lowered requirement additionally retains its validated source-to-lower requirement mapping. Missing, ambiguous, swapped, or owner-mismatched paths fail closed. A runtime copy or capability union cannot replace that canonical association. [Canonical machinery coverage](#canonical-machinery-coverage) is checked before accepting either a grant or a protected use.""",
          )

          # Canonical trace: path-qualify first-lowering scope endpoints.
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """scope_ref:\n    scope_kind\n    scope_id""",
              """scope_ref:\n    owner_scope_path[]:\n        scope_kind\n        scope_id""",
          )
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """For example:\n\n```text\nextension_requirement_lowering_decisions[]:""",
              """`owner_scope_path[]` is the complete ordered absolute containment path within the representation named by that lowering boundary. For Semantic-IR endpoints it includes JOB, DECK, and CARD ancestors as applicable; for Core endpoints it includes every enclosing Core scope needed to distinguish locally repeated IDs. The terminal path element is the referenced scope itself. A bare `(scope_kind, scope_id)` pair is not a valid first-lowering endpoint when local IDs can repeat. Missing, truncated, reordered, or ambiguous paths fail conformance for extension, machinery, result-determinism, numeric, randomness, and failure-behavior decision families.\n\nFor example:\n\n```text\nextension_requirement_lowering_decisions[]:""",
          )

          # Canonical trace: exact generated artifact executed by each protected use.
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """    backend_unit_id?\n    source_card_ids[]\n    card_execution_ids[]""",
              """    backend_unit_id?\n    generated_artifact_ids[]\n    source_card_ids[]\n    card_execution_ids[]""",
          )
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """`card_execution_ids[]` identifies the concrete CARD invocations participating in this use, not all invocations of the source CARD or backend unit. It is nonempty for CARD-governed work, and every ID resolves through `card_executions[]` to the corresponding canonical CARD and DECK execution in this run. A repeated launch, retry, or loop iteration receives a distinct use record with the correct concrete invocation IDs; an event index alone is not this join.\n\n`output_ids[]` identifies all outputs materially produced or exposed by this exact protected-use event.""",
              """`card_execution_ids[]` identifies the concrete CARD invocations participating in this use, not all invocations of the source CARD or backend unit. It is nonempty for CARD-governed work, and every ID resolves through `card_executions[]` to the corresponding canonical CARD and DECK execution in this run. A repeated launch, retry, or loop iteration receives a distinct use record with the correct concrete invocation IDs; an event index alone is not this join.\n\n`generated_artifact_ids[]` identifies the exact generated executable, kernel, bytecode, or equivalent artifact bytes actually launched or consumed by this protected-use occurrence. Every reference resolves to `generated_artifacts[]` and must be compatible with this use's backend-selection scope, concrete selection decision, and backend unit. The array is nonempty whenever protected use executes generated code, including a use that later fails before producing any output. It is empty only when the protected operation genuinely consumes no generated artifact. `backend_unit_id`, selection scope, output attribution, or the scope's final decision cannot reconstruct this identity when reference and optimized variants coexist.\n\n`output_ids[]` identifies all outputs materially produced or exposed by this exact protected-use event.""",
          )

          # Canonical trace: exact direct IR consumed by toolchain invocation.
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              "    input_ir_hashes[]?\n    input_ids[]",
              "    input_ir_hashes[]\n    input_ids[]",
          )
          replace(
              "docs/TRACE-AND-PROVENANCE.md",
              """`material_tool_identity` is immutable/versioned identity sufficient to distinguish the actual compiler, assembler, linker, code generator, or frozen equivalent used by that invocation. It may be represented by a version plus binary/content hash, immutable tool artifact ID, or another frozen identity adequate for the reproducibility claim.\n\n`input_ids[]` resolves to identified immutable `inputs[]` records""",
              """`material_tool_identity` is immutable/versioned identity sufficient to distinguish the actual compiler, assembler, linker, code generator, or frozen equivalent used by that invocation. It may be represented by a version plus binary/content hash, immutable tool artifact ID, or another frozen identity adequate for the reproducibility claim.\n\n`input_ir_hashes[]` is always explicit and contains the exact content hash(es) of every IR snapshot directly consumed by the invocation. It must be nonempty whenever the invocation consumes Semantic/Core/Vector-Dataflow/backend IR, including ordinary non-optimized code generation; it is empty only when that invocation consumes no IR. A generated artifact's direct producer must therefore content-bind the precise IR revision that produced its bytes. Source summaries, backend-unit identity, tool flags, target identity, transitive artifact ancestry, or a differing output hash cannot substitute for the direct IR input edge.\n\n`input_ids[]` resolves to identified immutable `inputs[]` records""",
          )

          # Reproducibility projection: owner-qualified effect declarations.
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              "## Per-effect authorization provenance\n\n",
              """## Declared effect requirement identity\n\n```text\neffect_requirements[]:\n    declared_effect_id\n    owner_scope_path[]:\n        scope_kind\n        scope_id\n    card_id\n    effect_kind\n    required_capabilities[]\n```\n\nEvery declaration resolves by `(owner_scope_path[], declared_effect_id)` against the hash-bound canonical Semantic IR. The complete ordered path includes JOB, DECK, and CARD ancestors and terminates at the CARD identified by `card_id`; local CARD/effect IDs are not globally unique. Missing or mismatched ancestors fail closed before authorization or attempt accounting.\n\n## Per-effect authorization provenance\n\n""",
          )

          # Reproducibility projection: path-qualified lowering refs.
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """scope_ref:\n    scope_kind\n    scope_id""",
              """scope_ref:\n    owner_scope_path[]:\n        scope_kind\n        scope_id""",
          )
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """At the first boundary, `machinery_requirement_lowering_decisions[]` uses identified mapping groups""",
              """Every first-boundary scope reference uses the complete ordered absolute containment path in its own representation. Semantic endpoints carry all JOB/DECK/CARD ancestors as applicable; Core endpoints carry all enclosing Core scopes needed to distinguish locally repeated IDs. Bare kind/local-ID pairs are insufficient.\n\nAt the first boundary, `machinery_requirement_lowering_decisions[]` uses identified mapping groups""",
          )

          # Reproducibility projection: generated artifact per protected use.
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """    backend_unit_id?\n    source_card_ids[]\n    card_execution_ids[]""",
              """    backend_unit_id?\n    generated_artifact_ids[]\n    source_card_ids[]\n    card_execution_ids[]""",
          )
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """Shared uses list the concrete participating executions under the frozen execution mapping. `output_ids[]` names every output materially produced or exposed by this exact protected-use occurrence""",
              """Shared uses list the concrete participating executions under the frozen execution mapping. `generated_artifact_ids[]` names the exact generated code artifact(s) actually executed by the use and remains populated even when the use fails before producing an output; every ID must match the use's backend scope/decision/unit. `output_ids[]` names every output materially produced or exposed by this exact protected-use occurrence""",
          )

          # Reproducibility projection: exact IR input hashes are mandatory when IR is consumed.
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              "    input_ir_hashes[]?\n    input_ids[]",
              "    input_ir_hashes[]\n    input_ids[]",
          )
          replace(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """`material_tool_identity` must be an immutable/versioned identity adequate to distinguish the actual tool used for the active reproducibility claim, such as version plus executable/content hash, immutable tool artifact ID, or frozen equivalent.\n\n`input_ids[]` resolves""",
              """`material_tool_identity` must be an immutable/versioned identity adequate to distinguish the actual tool used for the active reproducibility claim, such as version plus executable/content hash, immutable tool artifact ID, or frozen equivalent.\n\n`input_ir_hashes[]` is explicit and must contain every exact IR snapshot directly consumed by the invocation. It is nonempty for any compilation/code-generation step that consumes IR, optimized or not, and empty only for a step that consumes no IR. Tool, flags, target, backend-unit, source summaries, or output hashes cannot reconstruct this direct input identity.\n\n`input_ids[]` resolves""",
          )

          # Failure projection: retain exact generated artifact even when no output exists.
          replace(
              "docs/FAILURE-AND-PARTIAL-EFFECTS.md",
              """    machinery_authorization_record_ids[]\n    output_ids[]\n    protected_use_kind""",
              """    machinery_authorization_record_ids[]\n    generated_artifact_ids[]\n    output_ids[]\n    protected_use_kind""",
          )
          replace(
              "docs/FAILURE-AND-PARTIAL-EFFECTS.md",
              """`backend_selection_decision_id` identifies the concrete selection decision governing the use, not merely its shared selection scope. `card_execution_ids[]` identifies the actual participating CARD invocations""",
              """`backend_selection_decision_id` identifies the concrete selection decision governing the use, not merely its shared selection scope. `generated_artifact_ids[]` identifies the exact generated executable/kernel/bytecode bytes actually launched by the protected use and remains available when failure occurs before any output exists; every referenced artifact must resolve consistently with the selection scope/decision/backend unit. `card_execution_ids[]` identifies the actual participating CARD invocations""",
          )

          # README projection guidance.
          replace(
              "README.md",
              """Each machinery use carries concrete participating `card_execution_ids[]`, nonempty for CARD-governed work and resolving to the actual invocations in `card_executions[]`. Repeated uses under one selection scope/decision cannot collapse retries or iterations into canonical source CARD IDs. Genuine pre-CARD setup may have an empty array only with `initiating_scope_ref`, a typed RUN or DECK_EXECUTION reference resolving to the actual `run_id` or `deck_execution_id`; it must not fabricate a CARD execution. Shared uses list their actual participating executions under the frozen execution mapping. Each protected use also carries `output_ids[]`, reciprocally matched by `outputs[].machinery_use_record_ids[]`, so two launches under the same CARD execution/scope/artifact remain occurrence-distinguishable.""",
              """Each machinery use carries concrete participating `card_execution_ids[]`, nonempty for CARD-governed work and resolving to the actual invocations in `card_executions[]`. Repeated uses under one selection scope/decision cannot collapse retries or iterations into canonical source CARD IDs. Genuine pre-CARD setup may have an empty array only with `initiating_scope_ref`, a typed RUN or DECK_EXECUTION reference resolving to the actual `run_id` or `deck_execution_id`; it must not fabricate a CARD execution. Shared uses list their actual participating executions under the frozen execution mapping. Each protected use carries `generated_artifact_ids[]` naming the exact generated executable/kernel/bytecode actually launched, including uses that fail before producing any output, plus `output_ids[]` reciprocally matched by `outputs[].machinery_use_record_ids[]`. Backend unit or selection scope alone cannot distinguish reference and optimized variants.""",
          )
          replace(
              "README.md",
              """`backend_selection_scopes[]` identify governed machinery-selection records; `backend_selection_decisions[]` preserve the ordered decision history""",
              """Canonical `effect_requirements[]` and `machinery_requirements[]` are owner-qualified: each local declaration retains the complete ordered absolute `owner_scope_path[]` through its JOB/DECK/CARD owner as applicable. First-lowering scope references likewise retain complete containment paths in their source/Core representations rather than only kind plus local ID.\n\n`backend_selection_scopes[]` identify governed machinery-selection records; `backend_selection_decisions[]` preserve the ordered decision history""",
          )
          replace(
              "README.md",
              """Toolchain invocations also carry `input_ids[]` resolving to immutable `inputs[]` records""",
              """Toolchain invocations carry explicit `input_ir_hashes[]`, nonempty whenever that invocation directly consumes IR, so ordinary non-optimized code generation remains bound to the exact IR snapshot that produced the artifact. They also carry `input_ids[]` resolving to immutable `inputs[]` records""",
          )

          # Agent-facing rules.
          replace(
              "AGENTS.md",
              """13. preserve the explicit effect → complete capability-set association; do not replace it with an ambiguous CARD-level union;""",
              """13. preserve the explicit effect → complete capability-set association and owner-qualify every declared effect by its complete ordered JOB/DECK/CARD `owner_scope_path[]`; local CARD/effect IDs are not globally unique and must not replace that path;""",
          )
          replace(
              "AGENTS.md",
              """31. record extension, determinism, numeric, randomness, machinery-requirement, and failure-behavior scope mappings through the applicable lowering whenever lower scope identities change; at both machinery boundaries, preserve explicit source/lower machinery-requirement IDs as well as typed scope endpoints;""",
              """31. record extension, determinism, numeric, randomness, machinery-requirement, and failure-behavior scope mappings through the applicable lowering whenever lower scope identities change; first-lowering source/Core scope references use complete ordered containment paths rather than kind plus local ID, and at both machinery boundaries preserve explicit source/lower machinery-requirement IDs;""",
          )
          replace(
              "AGENTS.md",
              """37. bind protected-machinery authorization records to the concrete backend-selection decision/scope they govern; every `machinery_requirement_refs[]` entry uses the complete ordered absolute JOB/DECK/CARD `owner_scope_path[]` plus local requirement ID, and same-domain authorization-before-use ordering is preserved through identified machinery-use records linked to their actual concrete CARD executions or genuine pre-CARD initiating scope and exact outputs;""",
              """37. bind protected-machinery authorization records to the concrete backend-selection decision/scope they govern; every machinery declaration/reference uses the complete ordered absolute JOB/DECK/CARD `owner_scope_path[]` plus local requirement ID, and same-domain authorization-before-use ordering is preserved through identified machinery-use records linked to their actual concrete CARD executions or genuine pre-CARD initiating scope, exact generated artifacts executed, and exact outputs;""",
          )
          replace(
              "AGENTS.md",
              """When optimized code is generated, the generated artifact records the applicable `optimized_ir_hash`""",
              """Every toolchain/code-generation invocation that directly consumes IR records explicit `input_ir_hashes[]` containing the exact consumed IR snapshot(s); the array may be empty only when the invocation consumes no IR. Tool/flags/target/backend-unit metadata or differing output hashes do not substitute for this direct content-bound input edge.\n\nWhen optimized code is generated, the generated artifact records the applicable `optimized_ir_hash`""",
          )

          # Roadmap gates: keep the authoritative projections aligned.
          replace(
              "ROADMAP.md",
              """- canonical `effect_requirements[]`, each carrying source CARD ID, declared effect ID, effect kind, and complete `required_capabilities[]`;\n- canonical `machinery_requirements[]`, each carrying stable requirement identity, governing source scope, target selector/class, and complete required-capability set;""",
              """- canonical `effect_requirements[]`, each carrying complete ordered absolute JOB/DECK/CARD `owner_scope_path[]`, source CARD ID, declared effect ID, effect kind, and complete `required_capabilities[]`;\n- canonical `machinery_requirements[]`, each carrying stable requirement identity, complete ordered absolute owning `owner_scope_path[]`, target selector/class, and complete required-capability set;""",
          )
          replace(
              "ROADMAP.md",
              """- `machinery_authorization_records[]` with stable authorization identity, governing selection scope/decision, applicable machinery requirement IDs, complete required/granted/denied capability sets, policy identity/version, authorization outcome, and authorization sequence index;\n- `machinery_use_records[]` with stable use identity, governing selection scope/decision/backend unit, concrete participating `card_execution_ids[]`, applicable authorization IDs, protected-use start index, and optional stop index.""",
              """- `machinery_authorization_records[]` with stable authorization identity, governing selection scope/decision, absolute-owner-path-qualified machinery requirement references, complete required/granted/denied capability sets, policy identity/version, authorization outcome, and authorization sequence index;\n- `machinery_use_records[]` with stable use identity, governing selection scope/decision/backend unit, concrete participating `card_execution_ids[]`, exact `generated_artifact_ids[]` executed where applicable, authorization IDs, protected-use start index, exact output IDs, and optional stop index.""",
          )
          replace(
              "ROADMAP.md",
              """- identified cardinality-aware machinery-requirement mappings with typed source/Core scopes and explicit `source_machinery_requirement_ids[]` / `lower_machinery_requirement_ids[]`;""",
              """- identified cardinality-aware machinery-requirement mappings with complete ordered source/Core scope paths and explicit `source_machinery_requirement_ids[]` / `lower_machinery_requirement_ids[]`;""",
          )
          replace(
              "ROADMAP.md",
              """`machinery_requirement_lowering_decisions[]` requires identified mapping groups, typed `source_scope_refs[]` / `core_scope_refs[]`, and nonempty deterministic `source_machinery_requirement_ids[]` / `lower_machinery_requirement_ids[]`.""",
              """`machinery_requirement_lowering_decisions[]` requires identified mapping groups, complete ordered absolute `source_scope_refs[]` / `core_scope_refs[]` containment paths, and nonempty deterministic `source_machinery_requirement_ids[]` / `lower_machinery_requirement_ids[]`.""",
          )
          replace(
              "ROADMAP.md",
              """- identified `toolchain_invocations[]` recording the exact material compiler/assembler/linker/code-generation identities, invocation order, target/ABI, deterministic build flags/configuration, immutable non-generated dependency `input_ids[]`, direct generated-artifact inputs/outputs, backend unit, and backend-selection scope;""",
              """- identified `toolchain_invocations[]` recording the exact material compiler/assembler/linker/code-generation identities, invocation order, target/ABI, deterministic build flags/configuration, explicit exact `input_ir_hashes[]` whenever IR is directly consumed, immutable non-generated dependency `input_ids[]`, direct generated-artifact inputs/outputs, backend unit, and backend-selection scope;""",
          )

          # Domain lowering documentation: state the path-qualified endpoint rule explicitly.
          replace(
              "docs/SEMANTIC-TO-CORE-LOWERING.md",
              """`extension_requirement_lowering_decisions[]` binds each materially transformed source extension requirement to the Core scope(s) that inherit it, retaining source scope identity, source CARD provenance, resolved profile/version/content/contract identity, and the frozen mapping rule.""",
              """`extension_requirement_lowering_decisions[]` binds each materially transformed source extension requirement to the Core scope(s) that inherit it. Every source/Core scope endpoint is represented by its complete ordered absolute containment path in that representation, not only a kind/local-ID pair; source Semantic paths include JOB/DECK/CARD ancestors as applicable. The record also retains source CARD provenance, resolved profile/version/content/contract identity, and the frozen mapping rule.""",
          )

      - name: Validate patch
        run: |
          git diff --check
          git diff -- docs/TRACE-AND-PROVENANCE.md docs/DETERMINISM-AND-REPRODUCIBILITY.md docs/FAILURE-AND-PARTIAL-EFFECTS.md docs/SEMANTIC-TO-CORE-LOWERING.md README.md AGENTS.md ROADMAP.md
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TRACE-AND-PROVENANCE.md docs/DETERMINISM-AND-REPRODUCIBILITY.md docs/FAILURE-AND-PARTIAL-EFFECTS.md docs/SEMANTIC-TO-CORE-LOWERING.md README.md AGENTS.md ROADMAP.md
          git rm .github/workflows/provenance-review-fix-2.yml
          git diff --cached --check
          git commit -m "docs: qualify provenance identities and build inputs"
          git push origin HEAD:docs/foundation-specification
