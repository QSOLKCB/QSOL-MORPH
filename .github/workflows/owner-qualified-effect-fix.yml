name: One-shot owner-qualified effect provenance fix

on:
  push:
    branches:
      - docs/foundation-specification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))
              print(f"patched {path}")

          replace_once(
              'docs/VECTOR-AND-DATAFLOW.md',
              '''```text\ndeclared_effect_id\neffect_kind\nrequired_capabilities[]\nsource/failure order\nruntime effect-attempt provenance hook\n```\n\n`declared_effect_id` is the canonical semantic effect identity that survives lowering. A later `effect_attempt_id` identifies a concrete runtime attempt. The two identities must remain distinguishable so retries, duplicate attempts, or same-kind effects from one CARD can be audited.\n''',
              '''```text\ndeclared_effect_ref:\n    owner_scope_path[]:\n        scope_kind\n        scope_id\n    declared_effect_id\neffect_kind\nrequired_capabilities[]\nsource/failure order\nruntime effect-attempt provenance hook\n```\n\n`declared_effect_ref` is the canonical owner-qualified semantic effect identity that survives both mandatory lowerings. Its complete ordered `owner_scope_path[]` identifies the JOB/DECK/CARD containment path that owns the local `declared_effect_id`; the terminal path element is the declaring CARD. A local effect ID or `(card_id, declared_effect_id)` pair is insufficient because sibling DECKs may reuse both local IDs. Core→Vector/Dataflow lowering must preserve this complete composite identity directly or under a frozen provenance-visible mapping whose lower record can reconstruct the exact same owner-qualified declaration. A later `effect_attempt_id` identifies a concrete runtime attempt. Declaration and attempt identities remain distinct so retries, duplicate attempts, or same-kind effects from one CARD can be audited. Missing, truncated, reordered, or owner-mismatched effect paths fail conformance rather than being guessed from nearby CARD IDs.\n'''
          )

          replace_once(
              'docs/TRACE-AND-PROVENANCE.md',
              '''    source_requirement_refs[]:\n        representation_kind\n        ir_hash\n        scope_kind\n        scope_id\n        requirement_hash\n    governing_scope_refs[]:\n        representation_kind\n        ir_hash\n        scope_kind\n        scope_id\n    source_card_ids[]\n''',
              '''    source_requirement_refs[]:\n        representation_kind\n        ir_hash\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n        requirement_hash\n    governing_scope_refs[]:\n        representation_kind\n        ir_hash\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n'''
          )

          replace_once(
              'docs/TRACE-AND-PROVENANCE.md',
              '''Each nonempty `source_requirement_refs[]` entry is a composite reference to one exact requirement in the hash-bound original input representation: the typed owning scope plus the canonical hash of the complete `ExtensionRequirement` value, including profile, requested version/range, and any required contract identity. It resolves to the owned canonical requirement, not to an arbitrarily selected child CARD. Ambiguous duplicate requirements require a frozen canonical deduplication rule or fail resolution. `representation_kind` distinguishes Semantic IR, Core IR, and other explicitly frozen input representations; an execution that legitimately starts with Core IR must not fabricate a Semantic IR source.\n\nEach nonempty `governing_scope_refs[]` identifies the actual typed scope(s) and IR version in which the resolution interprets syntax, adapters, effects, or lowering hooks. Source ownership remains separately preserved. Validate that the resolved profile/version satisfies every referenced source requirement, that any required contract identity matches, and that the identified implementation components implement that exact contract. Unknown versions, mismatched hashes, missing components, unresolved owners, or an unestablished requirement-to-resolution association fail closed before the extension is used.\n''',
              '''Each nonempty `source_requirement_refs[]` entry is a composite reference to one exact requirement in the hash-bound original input representation: `representation_kind`, `ir_hash`, the complete representation-relative `owner_scope_path[]`, and the canonical hash of the complete `ExtensionRequirement` value, including profile, requested version/range, and any required contract identity. Every ancestor needed to disambiguate the owning local scope participates in identity. A one-level `{ scope_kind, scope_id }` pair is insufficient when sibling containers reuse CARD, region, or other local IDs. The reference resolves to the owned canonical requirement, not to an arbitrarily selected child CARD. Ambiguous duplicate requirements require a frozen canonical deduplication rule or fail resolution. `representation_kind` distinguishes Semantic IR, Core IR, and other explicitly frozen input representations; an execution that legitimately starts with Core IR must not fabricate a Semantic IR source.\n\nEach nonempty `governing_scope_refs[]` identifies the actual representation-relative scope path(s) and IR version in which the resolution interprets syntax, adapters, effects, or lowering hooks. Source ownership remains separately preserved. Validate each full path against the hash-bound representation and reject missing, truncated, reordered, ambiguous, or owner-mismatched paths. Then validate that the resolved profile/version satisfies every referenced source requirement, that any required contract identity matches, and that the identified implementation components implement that exact contract. Unknown versions, mismatched hashes, missing components, unresolved owners, or an unestablished requirement-to-resolution association fail closed before the extension is used.\n'''
          )

          replace_once(
              'docs/TRACE-AND-PROVENANCE.md',
              '''Before accepting authorization, resolve the attempt's declaration using its canonical `declared_effect_id` and owning `card_id` in the hash-bound input. The trace declaration must match that canonical record. Then require:\n''',
              '''Before accepting authorization, derive the attempt's complete canonical effect-owner path from its concrete `card_execution_id`: resolve that CARD execution to its `deck_execution_id`, resolve the DECK execution to its stable canonical DECK, and recover the enclosing canonical JOB/DECK/CARD containment path in the hash-bound input. The terminal path element must be the same canonical CARD identified by the attempt and authorization. Then resolve the declaration by the exact tuple `(owner_scope_path[], declared_effect_id)`. A lookup by only `declared_effect_id`, `card_id`, or their pair is invalid because sibling DECKs may reuse both local IDs. The traced `effect_requirements[]` entry must carry the same complete owner path and match that canonical declaration. Missing, truncated, reordered, ambiguous, wrong-execution, or owner-mismatched paths fail closed before capability comparison. Then require:\n'''
          )
          PY

          rm -f .github/workflows/owner-qualified-effect-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: preserve owner-qualified effect provenance"
          git push origin HEAD:docs/foundation-specification
