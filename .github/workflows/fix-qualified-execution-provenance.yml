name: Apply qualified execution provenance fixes

on:
  push:
    branches:
      - docs/foundation-specification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foundation-specification
          fetch-depth: 0

      - name: Apply documentation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # TRACE: owner-qualified governed backend scope.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """backend_selection_scopes[]:\n    backend_selection_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    backend_unit_id?\n    selection_decision_ids[]\n    final_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable selection-record key. `scope_kind` plus `scope_id` identify the governed computation and are not aliases for the selection-scope record identity.\n""",
              """backend_selection_scopes[]:\n    backend_selection_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    backend_unit_id?\n    selection_decision_ids[]\n    final_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable selection-record key. `governed_scope_ref` identifies the exact computation governed by the record through its representation kind, content/run identity, and complete representation-relative owner path. For Semantic IR, Core IR, and Vector/Dataflow IR, `representation_identity` is the corresponding content-bound IR hash; a runtime-only frozen representation uses its stable run/execution identity. The terminal `owner_scope_path[]` element is the governed scope itself, and every enclosing scope needed to disambiguate reused local IDs is retained. `source_card_ids[]` is provenance summary context only and cannot replace owner qualification. The governed-scope reference and selection-scope record identity are not aliases. Missing, truncated, reordered, ambiguous, wrong-representation, or unresolved governed paths fail closed.\n""",
          )

          # TRACE: owner-qualified execution-contract scopes.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """result_determinism_scopes[]:\n    result_determinism_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_result_determinism\n    effective_result_determinism\n    transition_authorized_by?\n    transition_evidence_id?\n    backend_unit_id?\n\nnumeric_execution_scopes[]:\n    numeric_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    numeric_contract_id\n    numeric_contract_hash\n    material_numeric_mode\n    backend_unit_id?\n\nrandomness_execution_scopes[]:\n    randomness_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_randomness_mode\n    effective_randomness_mode\n    transition_authorized_by?\n    transition_evidence_id?\n    rng_algorithm?\n    rng_version?\n    seed?\n    stream_id?\n    parallel_partitioning?\n    entropy_effect_attempt_ids[]?\n    entropy_input_ids[]?\n    backend_unit_id?\n\nfailure_behavior_bindings[]:\n    failure_behavior_binding_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_failure_behavior_id\n    effective_failure_behavior_id\n    mapping_or_transition_rule_id?\n    transition_evidence_id?\n```\n\nOutput references resolve directly to `result_determinism_scope_id`, `numeric_scope_id`, `randomness_scope_id`, and `failure_behavior_binding_id`. They never infer those records from a generic `scope_id`.\n""",
              """result_determinism_scopes[]:\n    result_determinism_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_result_determinism\n    effective_result_determinism\n    transition_authorized_by?\n    transition_evidence_id?\n    backend_unit_id?\n\nnumeric_execution_scopes[]:\n    numeric_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    numeric_contract_id\n    numeric_contract_hash\n    material_numeric_mode\n    backend_unit_id?\n\nrandomness_execution_scopes[]:\n    randomness_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_randomness_mode\n    effective_randomness_mode\n    transition_authorized_by?\n    transition_evidence_id?\n    rng_algorithm?\n    rng_version?\n    seed?\n    stream_id?\n    parallel_partitioning?\n    entropy_effect_attempt_ids[]?\n    entropy_input_ids[]?\n    backend_unit_id?\n\nfailure_behavior_bindings[]:\n    failure_behavior_binding_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_failure_behavior_id\n    effective_failure_behavior_id\n    mapping_or_transition_rule_id?\n    transition_evidence_id?\n```\n\nAll four execution-contract families use the same fully qualified `governed_scope_ref` rule as backend selection. The record's type-specific stable key identifies the ledger entry; it does not establish which canonical computation that entry governs. The owner path must resolve uniquely in the named, content-bound representation, with the terminal path segment naming the governed scope itself. `source_card_ids[]` is corroborating provenance only. Thus sibling DECKs may each contain local `CARD 7` while their contract scopes remain distinct through their complete JOB/DECK/CARD paths. Missing, truncated, reordered, ambiguous, wrong-representation, or owner-mismatched paths fail validation.\n\nOutput references resolve directly to `result_determinism_scope_id`, `numeric_scope_id`, `randomness_scope_id`, and `failure_behavior_binding_id`. They never infer those records from a local computation ID or from source CARD summaries.\n""",
          )

          # TRACE: distinguish a DECK's caused failure from a prior failure that blocks it.
          replace_once(
              "docs/TRACE-AND-PROVENANCE.md",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    failure_record_id?\n```\n\nEvery CARD execution is a distinct runtime object:\n""",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    governing_failure_record_id?\n    failure_record_id?\n```\n\n`failure_record_id?` identifies the failure caused by this DECK execution when the DECK itself fails. `governing_failure_record_id?` instead identifies an earlier concrete failure whose active policy prevented this selected DECK from starting or otherwise blocked it. For a DECK marked non-started/skipped because of prior fail-stop, `governing_failure_record_id` is required and must resolve to the actual blocking failure and applicable failure-behavior binding; `failure_record_id` is absent unless the DECK itself also produced a distinct failure under a frozen rule. The two fields are not aliases and causal ordering must be validated rather than inferred from list position.\n\nEvery CARD execution is a distinct runtime object:\n""",
          )

          # Reproducibility: mirror fully qualified execution-contract scope records.
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """failure_behavior_bindings[]:\n    failure_behavior_binding_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_failure_behavior_id\n    effective_failure_behavior_id\n    mapping_or_transition_rule_id?\n    transition_evidence_id?\n```\n""",
              """failure_behavior_bindings[]:\n    failure_behavior_binding_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_failure_behavior_id\n    effective_failure_behavior_id\n    mapping_or_transition_rule_id?\n    transition_evidence_id?\n```\n""",
          )
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """result_determinism_scopes[]:\n    result_determinism_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_result_determinism\n    effective_result_determinism\n    transition_authorized_by?\n    transition_evidence_id?\n    backend_unit_id?\n```\n""",
              """result_determinism_scopes[]:\n    result_determinism_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_result_determinism\n    effective_result_determinism\n    transition_authorized_by?\n    transition_evidence_id?\n    backend_unit_id?\n```\n""",
          )
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """randomness_execution_scopes[]:\n    randomness_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_randomness_mode\n""",
              """randomness_execution_scopes[]:\n    randomness_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    requested_randomness_mode\n""",
          )
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """numeric_execution_scopes[]:\n    numeric_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    numeric_contract_id\n""",
              """numeric_execution_scopes[]:\n    numeric_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    numeric_contract_id\n""",
          )
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """The three record keys above are type-specific on purpose. Overlapping JOB/CARD/region/kernel computation IDs must not make output references ambiguous.\n""",
              """The three record keys above are type-specific on purpose. Every execution-contract record also carries the shared fully qualified `governed_scope_ref`: representation kind, content/run identity, and the complete representation-relative `owner_scope_path[]` whose terminal element is the governed computation. Overlapping JOB/DECK/CARD/region/kernel local IDs therefore remain distinguishable. Stable ledger IDs and `source_card_ids[]` do not substitute for this canonical owner qualification.\n""",
          )

          # Reproducibility: mirror backend governed-scope qualification.
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """backend_selection_scopes[]:\n    backend_selection_scope_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    backend_unit_id?\n    selection_decision_ids[]\n    final_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable selection-scope record key. `scope_kind` plus `scope_id` identify the computation being governed and are not aliases for that record key.\n""",
              """backend_selection_scopes[]:\n    backend_selection_scope_id\n    governed_scope_ref:\n        representation_kind\n        representation_identity\n        owner_scope_path[]:\n            scope_kind\n            scope_id\n    source_card_ids[]\n    backend_unit_id?\n    selection_decision_ids[]\n    final_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable selection-scope record key. `governed_scope_ref` resolves the exact computation through representation identity plus its complete owner path, including every ancestor needed to distinguish repeated local IDs. `source_card_ids[]` is provenance context only. The governed computation and the selection-scope record key are distinct identities.\n""",
          )

          # Reproducibility: mirror DECK blocking cause.
          replace_once(
              "docs/DETERMINISM-AND-REPRODUCIBILITY.md",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    failure_record_id?\n```\n\nEvery selected DECK remains represented, including a DECK prevented from starting by prior fail-stop.\n""",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    governing_failure_record_id?\n    failure_record_id?\n```\n\nEvery selected DECK remains represented, including a DECK prevented from starting by prior fail-stop. A non-started/skipped DECK caused by prior failure requires `governing_failure_record_id` resolving to that concrete blocking failure; `failure_record_id` remains the distinct failure caused by the DECK itself when it executes and fails.\n""",
          )

          # Backend domain projection: owner-qualified governed scope.
          replace_once(
              "docs/BACKENDS-AND-MORPHING.md",
              """backend_selection_scope_id\nscope_kind\nscope_id\nsource_card_ids[]\nbackend_unit_id?\nselection_decision_ids[]\nfinal_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable identity of the selection-scope record itself. `scope_kind` + `scope_id` identify the computation governed by that record. They are distinct identities and must not be treated as aliases. Decisions, machinery-authorization records, generated artifacts, and outputs reference the stable `backend_selection_scope_id`.\n""",
              """backend_selection_scope_id\ngoverned_scope_ref:\n    representation_kind\n    representation_identity\n    owner_scope_path[]:\n        scope_kind\n        scope_id\nsource_card_ids[]\nbackend_unit_id?\nselection_decision_ids[]\nfinal_selection_decision_id?\n```\n\n`backend_selection_scope_id` is the stable identity of the selection-scope record itself. `governed_scope_ref` identifies the exact computation by its representation identity and complete representation-relative owner path, not by a local scope ID or source CARD summary. The terminal path element is the governed scope. These identities are distinct and must not be treated as aliases. Decisions, machinery-authorization records, generated artifacts, and outputs reference the stable `backend_selection_scope_id`.\n""",
          )

          # ROADMAP PR #5: qualified governed scopes.
          replace_once(
              "ROADMAP.md",
              """- `backend_selection_scopes[]`, each with stable `backend_selection_scope_id`, governed scope/source/backend unit, ordered decision IDs, and final decision ID when execution proceeds;\n""",
              """- `backend_selection_scopes[]`, each with stable `backend_selection_scope_id`, a fully qualified `governed_scope_ref` carrying representation identity plus complete representation-relative `owner_scope_path[]`, source/backend-unit provenance, ordered decision IDs, and final decision ID when execution proceeds;\n""",
          )
          replace_once(
              "ROADMAP.md",
              """- `result_determinism_scopes[]` with `result_determinism_scope_id`;\n- `numeric_execution_scopes[]` with `numeric_scope_id`;\n- `randomness_execution_scopes[]` with `randomness_scope_id`;\n- `failure_behavior_bindings[]` with stable `failure_behavior_binding_id`, governed scope/source provenance, requested/effective failure policy, and material mapping/transition identity.\n\nEach scope retains governed computation identity and source provenance. A single execution-wide scope is legal only when a frozen normalization proves it faithfully represents every governed source requirement.\n""",
              """- `result_determinism_scopes[]` with `result_determinism_scope_id` and fully qualified `governed_scope_ref`;\n- `numeric_execution_scopes[]` with `numeric_scope_id` and fully qualified `governed_scope_ref`;\n- `randomness_execution_scopes[]` with `randomness_scope_id` and fully qualified `governed_scope_ref`;\n- `failure_behavior_bindings[]` with stable `failure_behavior_binding_id`, fully qualified `governed_scope_ref`, source provenance, requested/effective failure policy, and material mapping/transition identity.\n\nEach `governed_scope_ref` carries representation identity plus the complete representation-relative `owner_scope_path[]`, including every ancestor needed to distinguish repeated local JOB/DECK/CARD/region/kernel IDs. Stable ledger IDs and source CARD summaries do not establish canonical ownership. A single execution-wide scope is legal only when a frozen normalization proves it faithfully represents every governed source requirement.\n""",
          )

          # ROADMAP PR #5: direct input consumers/acquisitions.
          replace_once(
              "ROADMAP.md",
              """Require identified immutable `inputs[]`, each binding stable `input_id` to the canonical value, content hash, immutable artifact/version identity, or frozen equivalent actually consumed.\n\nRequire identified `outputs[]`, each carrying at least:\n""",
              """Require identified immutable `inputs[]`, each binding stable `input_id` to the canonical value, content hash, immutable artifact/version identity, or frozen equivalent actually consumed, plus direct consumer/acquisition attribution:\n\n```text\ninputs[]:\n    input_id\n    input_kind\n    canonical_value?\n    content_hash?\n    artifact_id_or_version?\n    location?\n    media_or_schema_type?\n    source_card_ids[]?\n    consumer_card_execution_ids[]\n    consumer_scope_refs[]?\n    effect_attempt_ids[]\n```\n\nEvery concrete CARD invocation that consumes an input appears in `consumer_card_execution_ids[]` and reciprocally lists that `input_id` in `card_executions[].input_ids[]`, including failed or output-free invocations. Every effect-acquired input identifies the concrete supplying `effect_attempt_ids[]`, which reciprocally list the input in `effect_attempts[].acquired_input_ids[]`. Genuine pre-CARD setup may use typed `consumer_scope_refs[]`; canonical source CARD IDs or output-level input links are summaries/transitive attribution and cannot replace this direct-consumer ledger.\n\nRequire identified `outputs[]`, each carrying at least:\n""",
          )

          # ROADMAP PR #5: exact machinery use on outputs.
          replace_once(
              "ROADMAP.md",
              """backend_selection_scope_ids[]\ngenerated_artifact_ids[]?\nresult_determinism_scope_ids[]\n""",
              """backend_selection_scope_ids[]\ngenerated_artifact_ids[]?\nmachinery_use_record_ids[]\nresult_determinism_scope_ids[]\n""",
          )
          replace_once(
              "ROADMAP.md",
              """`input_ids[]` identifies the exact immutable inputs materially contributing to that output. Execution-wide input availability is not a substitute for per-output attribution.\n\n`failure_behavior_binding_ids[]` resolves to stable `failure_behavior_binding_id` records.\n""",
              """`input_ids[]` identifies the exact immutable inputs materially contributing to that output. Execution-wide input availability is not a substitute for per-output attribution.\n\n`machinery_use_record_ids[]` identifies the exact protected-use occurrence(s) that produced or materially supplied the output and reciprocates `machinery_use_records[].output_ids[]`. A shared CARD execution, backend-selection scope, generated artifact, or backend unit cannot replace this occurrence-level join when several protected launches occur.\n\n`failure_behavior_binding_ids[]` resolves to stable `failure_behavior_binding_id` records.\n""",
          )

          # ROADMAP PR #5: exact IR hashes consumed by toolchain invocation.
          replace_once(
              "ROADMAP.md",
              """- identified `toolchain_invocations[]` carrying stable invocation ID/order, invocation kind, immutable/versioned material tool identity, target/ABI context, exact flags/configuration, immutable general `input_ids[]` for material non-generated dependencies, direct generated-artifact inputs/outputs, backend unit, and backend-selection scope where applicable;\n""",
              """- identified `toolchain_invocations[]` carrying stable invocation ID/order, invocation kind, immutable/versioned material tool identity, target/ABI context, exact flags/configuration, explicit `input_ir_hashes[]`, immutable general `input_ids[]` for material non-generated dependencies, direct generated-artifact inputs/outputs, backend unit, and backend-selection scope where applicable;\n""",
          )
          replace_once(
              "ROADMAP.md",
              """Toolchain `input_ids[]` bind the immutable bytes of prebuilt objects, libraries, headers, startup files, sysroots, and implicit dependencies not generated in this run. Mutable locators or flags alone are insufficient. The array is empty only when no such material inputs were consumed; composite inputs content-bind the complete material dependency set under a frozen representation. Missing material dependency identity invalidates complete/reproducible build provenance.\n""",
              """Toolchain `input_ir_hashes[]` is always explicit: it is nonempty with the exact direct content hash(es) whenever the invocation consumes IR, including ordinary non-optimized code generation, and empty only when that invocation consumes no IR. Tool identity, flags, target, backend unit, or output artifact cannot substitute for this content-bound direct IR edge.\n\nToolchain `input_ids[]` bind the immutable bytes of prebuilt objects, libraries, headers, startup files, sysroots, and implicit dependencies not generated in this run. Mutable locators or flags alone are insufficient. The array is empty only when no such material inputs were consumed; composite inputs content-bind the complete material dependency set under a frozen representation. Missing material dependency identity invalidates complete/reproducible build provenance.\n""",
          )

          # SERIALIZATION: owner-qualified dependency references.
          replace_once(
              "docs/SERIALIZATION.md",
              """              RANDOMNESS_CONTRACT\n              DEPENDENCIES\n              SEQUENCING_CONSTRAINTS[]\n""",
              """              RANDOMNESS_CONTRACT\n              DEPENDENCIES[]\n                DEPENDENCY_ID?\n                PRODUCER_REF\n                  OWNER_SCOPE_PATH[]\n                    SCOPE_KIND\n                    SCOPE_ID\n                  PRODUCER_CARD_ID\n                  RESULT_BINDING_ID?\n              SEQUENCING_CONSTRAINTS[]\n""",
          )
          replace_once(
              "docs/SERIALIZATION.md",
              """`RESULT_BINDING` is the canonical `Card.result?` identity naming the value produced by a CARD when that field is present. It is distinct from the produced value itself: a lossless serializer must preserve both the data and the identity that dependent CARDs reference. Local binding IDs retain their owning scope through canonical containment or an explicit typed owner-scope path. Across lowering boundaries, the [qualified result-binding map](TRACE-AND-PROVENANCE.md#cardinality-aware-result-binding-maps) preserves that scope together with each binding ID; matching local text is not proof of identity.\n\n`QUALIFIERS` includes canonical CARD modifiers that affect execution or lowering, such as explicit target-selection, adapter, tuning, or extension-control qualifiers. Lossless formats must retain them exactly according to the frozen canonical model.\n""",
              """`RESULT_BINDING` is the canonical `Card.result?` identity naming the value produced by a CARD when that field is present. It is distinct from the produced value itself: a lossless serializer must preserve both the data and the identity that dependent CARDs reference. Local binding IDs retain their owning scope through canonical containment or an explicit typed owner-scope path. Across lowering boundaries, the [qualified result-binding map](TRACE-AND-PROVENANCE.md#cardinality-aware-result-binding-maps) preserves that scope together with each binding ID; matching local text is not proof of identity.\n\n`DEPENDENCIES[]` uses owner-qualified producer references. `OWNER_SCOPE_PATH[]` is the complete ordered absolute JOB/DECK/CARD containment path to the producer CARD; `PRODUCER_CARD_ID` must equal the terminal CARD identity, and `RESULT_BINDING_ID?` identifies the producer's local result binding when the dependency is value-specific. A CARD-level dependency may omit the result binding only when the frozen dependency kind genuinely targets the CARD as a whole. Cross-DECK dependencies therefore remain resolvable even when sibling DECKs reuse the same local CARD ID or result-binding name. Bare CARD IDs, bare result-binding strings, positional pairing, first-match lookup, and child relocation are not lossless dependency encodings. Unknown, truncated, reordered, owner-mismatched, or ambiguous producer paths fail deserialization/canonical validation.\n\n`QUALIFIERS` includes canonical CARD modifiers that affect execution or lowering, such as explicit target-selection, adapter, tuning, or extension-control qualifiers. Lossless formats must retain them exactly according to the frozen canonical model.\n""",
          )

          # Semantic IR: define the same canonical dependency reference so serialization is not stronger than the model.
          replace_once(
              "docs/SEMANTIC-IR.md",
              """ExtensionRequirement {\n    profile_name\n    required_version_or_range\n    contract_id_or_hash?\n}\n```\n""",
              """ExtensionRequirement {\n    profile_name\n    required_version_or_range\n    contract_id_or_hash?\n}\n\nDependencyRef {\n    dependency_id?\n    producer_ref {\n        owner_scope_path[] { scope_kind, scope_id }\n        producer_card_id\n        result_binding_id?\n    }\n}\n```\n""",
          )
          replace_once(
              "docs/SEMANTIC-IR.md",
              """Stable JOB and DECK identities similarly allow multi-job/multi-deck workflows, failure propagation, output provenance, and cross-deck dependencies to refer to the same semantic objects before and after serialization or lowering.\n\nWhether identifiers are user-visible, generated, or both is not yet frozen.\n""",
              """Stable JOB and DECK identities similarly allow multi-job/multi-deck workflows, failure propagation, output provenance, and cross-deck dependencies to refer to the same semantic objects before and after serialization or lowering.\n\nCanonical `dependencies[]` therefore use `DependencyRef` rather than an unqualified local producer ID. Each producer reference carries the complete ordered absolute owner path to the producer CARD plus its canonical `producer_card_id` and, where the dependency targets a produced value, the local `result_binding_id`. The terminal path CARD must match `producer_card_id`. Cross-DECK dependencies remain distinct when sibling DECKs reuse CARD IDs or binding names; bare local IDs, positional lookup, and first-match resolution are invalid.\n\nWhether identifiers are user-visible, generated, or both is not yet frozen.\n""",
          )

          # Failure-domain projection: mirror DECK blocking cause.
          replace_once(
              "docs/FAILURE-AND-PARTIAL-EFFECTS.md",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    failure_record_id?\n```\n\nA derived `completed_decks[]` summary may be useful, but it is not a substitute for identified per-DECK execution records because it cannot represent the failed DECK and later DECKs that never started.\n""",
              """deck_executions[]:\n    deck_execution_id\n    deck_id\n    deck_status\n    card_execution_ids[]\n    execution_order_index?\n    governing_failure_record_id?\n    failure_record_id?\n```\n\n`governing_failure_record_id?` identifies the earlier concrete failure that blocks a selected DECK from starting under the active failure policy. `failure_record_id?` identifies a failure caused by this DECK execution itself. A fail-stop-skipped DECK requires the governing cause and must not overload `failure_record_id` with that different meaning.\n\nA derived `completed_decks[]` summary may be useful, but it is not a substitute for identified per-DECK execution records because it cannot represent the failed DECK and later DECKs that never started.\n""",
          )

          # AGENTS: mirror governed-scope qualification and DECK cause distinction.
          replace_once(
              "AGENTS.md",
              """failure_behavior_bindings[]:\n    failure_behavior_binding_id\n    scope_kind\n    scope_id\n    source_card_ids[]\n    requested_failure_behavior_id\n    effective_failure_behavior_id\n    mapping_or_transition_rule_id?\n```\n""",
