          set -euo pipefail
          rm -f .github/workflows/fix-qualified-provenance-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: qualify execution provenance identities"
          git push origin HEAD:docs/foundation-specification
