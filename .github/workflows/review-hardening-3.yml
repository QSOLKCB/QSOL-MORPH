name: One-shot review projection hardening

on:
  push:
    branches:
      - docs/foundation-specification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant brittle prose edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/review_hardening_3.py')
          s = p.read_text()
          needles = [
              '''replace_once(\n    "docs/DETERMINISM-AND-REPRODUCIBILITY.md",\n    "Candidate classifications are `COLD_EXECUTION`, `VERIFIED_REUSE`, and `UNVERIFIED_HIT`, or frozen equivalents. For `VERIFIED_REUSE`, both `legality_rule_id` and `verification_evidence_id` are mandatory and resolve to the shared rule/evidence ledgers.\\n",''',
              '''replace_once(\n    "AGENTS.md",\n    "`input_ids[]` resolves to immutable `inputs[]` records for every material dependency not generated in this run, including prebuilt objects, static libraries, headers, startup files, sysroots, and implicit toolchain inputs.\\n",''',
          ]
          for needle in needles:
              start = s.find(needle)
              if start < 0:
                  raise SystemExit(f'prose edit block not found: {needle[:80]!r}')
              end = s.find('\n)\n', start)
              if end < 0:
                  raise SystemExit('prose edit block terminator not found')
              s = s[:start] + s[end + 3:]
          p.write_text(s)
          PY
      - name: Apply patch
        run: python .github/scripts/review_hardening_3.py
      - name: Commit patch and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/review_hardening_3.py .github/workflows/review-hardening-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: harden provenance projection identity"
          git push origin HEAD:docs/foundation-specification
